[package]
publish = ["idle-host-tools"]
name = "idle-history-collector"
version.workspace = true
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Folder-bound source collection and history change notifications"
repository = "https://github.com/idleai/host-tools"
readme = "../../README.md"
keywords = ["idle", "history", "development"]
categories = ["development-tools"]

[dependencies]
idle-host-io = { registry = "idle-host-tools", version = "0.1.3", path = "../idle-host-io" }
editchain-core = { registry = "idle-editchain", version = "0.1.0" }
editchain-engine = { registry = "idle-editchain", version = "0.1.0" }
idle-history-import = { registry = "idle-host-tools", version = "0.1.3", path = "../idle-history-import" }
editchain-store = { registry = "idle-editchain", version = "0.1.0" }
editchain-git = { registry = "idle-editchain", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
ctrlc = { version = "3.5", features = ["termination"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
