[package]
publish = false
name = "idle-coordination"
version.workspace = true
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Standalone repository coordination and native peer replication"
repository = "https://github.com/idleai/host-tools"
readme = "../../README.md"
keywords = ["collaboration", "replication"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
idle-history = { registry = "idle-host-tools", version = "0.1.0", path = "../idle-history" }
idle-protocol = { registry = "idle-host-tools", version = "0.1.0", path = "../idle-protocol" }
editchain-sync = { registry = "idle-editchain", version = "0.1.0" }
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
# Management, host and client must be upgraded and verified together.
tunnels = { git = "https://github.com/microsoft/dev-tunnels", rev = "bb2a7dbdc56312b01b86be6eb8ce9cda7bb932a2", default-features = false, features = ["connections"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# Match the SDK's pinned workspace patch when classifying an already-closed channel.
russh = { version = "0.37.1", default-features = false, features = ["openssl"] }

[dev-dependencies]
editchain-core = { registry = "idle-editchain", version = "0.1.0" }
editchain-store = { registry = "idle-editchain", version = "0.1.0" }
tokio = { version = "1", features = ["test-util"] }
