[package]
name = "idle-history-import"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Idle source import adapters and provider reconciliation"
repository = "https://github.com/idleai/host-tools"
readme = "../../README.md"
keywords = ["history", "import"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
idle-history = { path = "../idle-history" }
editchain-store = { path = "../../../editchain/crates/editchain-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["parsing"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
editchain-core = { path = "../../../editchain/crates/editchain-core" }

editchain-engine = { path = "../../../editchain/crates/editchain-engine" }

[dev-dependencies]
proptest = "1"
