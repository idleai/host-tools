[package]
publish = ["idle-host-tools"]
name = "idle-history-import"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Idle source import adapters and provider reconciliation"
repository = "https://github.com/idleai/host-tools"
readme = "../../README.md"
keywords = ["history", "import"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
fixtures = []

[dependencies]
idle-editor-capture = { registry = "idle-host-tools", version = "0.1.0", path = "../idle-editor-capture" }
idle-history = { registry = "idle-host-tools", version = "0.1.0", path = "../idle-history" }
editchain-store = { registry = "idle-editchain", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.11"
time = { version = "0.3", default-features = false, features = ["parsing"] }
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "process", "rt", "time"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
editchain-core = { registry = "idle-editchain", version = "0.1.0" }

editchain-engine = { registry = "idle-editchain", version = "0.1.0" }

[dev-dependencies]
proptest = "1"
