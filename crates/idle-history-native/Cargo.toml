[package]
publish = ["idle-host-tools"]
name = "idle-history-native"
version.workspace = true
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Shared native history queries, exact content reads and activity projections"
repository = "https://github.com/idleai/host-tools"
readme = "../../README.md"
keywords = ["idle", "history", "development"]
categories = ["development-tools"]

[features]
default = ["service"]
service = ["dep:idle-host-io", "dep:idle-editor-capture", "dep:idle-repository", "dep:serde"]

[dependencies]
idle-host-io = { registry = "idle-host-tools", version = "0.2.0", path = "../idle-host-io", optional = true }
editchain-core = { registry = "idle-editchain", version = "0.1.0" }
idle-editor-capture = { registry = "idle-host-tools", path = "../idle-editor-capture", version = "0.2.0", optional = true }
idle-history = { registry = "idle-host-tools", path = "../idle-history", version = "0.2.0" }
idle-protocol = { registry = "idle-host-tools", path = "../idle-protocol", version = "0.2.0" }
idle-repository = { registry = "idle-host-tools", path = "../idle-repository", version = "0.2.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "=1.0.151"
editchain-engine = { registry = "idle-editchain", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
idle-history-import = { registry = "idle-host-tools", version = "0.2.0", path = "../idle-history-import" }

[[bin]]
name = "idle-history-service"
required-features = ["service"]

[[example]]
name = "history-fixture"
required-features = ["service"]

[lints]
workspace = true
