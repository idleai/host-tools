[package]
publish = ["idle-host-tools"]
name = "idle-history-graph"
version.workspace = true
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Portable activity ordering, causal lanes and retained graph routes"
repository = "https://github.com/idleai/host-tools"
readme = "README.md"
keywords = ["idle", "history", "graph"]
categories = ["data-structures"]

[dependencies]
editchain-index = { registry = "idle-editchain", version = "0.1.6" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
idle-history = { registry = "idle-host-tools", version = "0.3.0", path = "../idle-history" }
editchain-core = { registry = "idle-editchain", version = "0.1.0" }
serde_json = "1"

[lints]
workspace = true
