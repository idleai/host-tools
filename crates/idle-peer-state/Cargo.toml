[package]
name = "idle-peer-state"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebAssembly bindings for shared peer connection state"
repository = "https://github.com/idleai/host-tools"
readme = "../../README.md"
keywords = ["crdt", "edit-chain", "agent"]
categories = ["data-structures", "database-implementations"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
idle-history = { path = "../idle-history" }
serde_json = { version = "1" }
wasm-bindgen = { version = "=0.2.127", default-features = false }
