[package]
name = "idle-history-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Idle command-line source import and provider inspection"
repository = "https://github.com/idleai/host-tools"

[dependencies]
idle-history-import = { path = "../idle-history-import" }
editchain-engine = { path = "../../../editchain/crates/editchain-engine" }
editchain-git = { path = "../../../editchain/crates/editchain-git" }
editchain-store = { path = "../../../editchain/crates/editchain-store" }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
