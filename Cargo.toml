[workspace]
members = [
    "crates/idle-host",
    "crates/idle-coordination",
    "crates/idle-editor-capture",
    "crates/idle-history-native",
    "crates/idle-history",
    "crates/idle-host-io",
    "crates/idle-history-collector",
    "crates/idle-history-import",
    "crates/idle-history-tools",
    "crates/idle-protocol",
    "crates/idle-repository",
    "crates/idle-ssh-buffer-compat",
]
resolver = "3"

[workspace.package]
version = "0.1.2"

# Dev Tunnels uses Microsoft's OpenSSL SSH fork, as does the native VS Code CLI.
# Pin every package to the same reviewed source; keep SDK/SSH integration tests together.
[patch.crates-io]
russh = { git = "https://github.com/microsoft/vscode-russh", rev = "0bced23016d869dc847b25840268896fd0969b69" }
russh-keys = { git = "https://github.com/microsoft/vscode-russh", rev = "0bced23016d869dc847b25840268896fd0969b69" }
russh-cryptovec = { path = "crates/idle-ssh-buffer-compat" }

# The SSH fork's original buffer predates RUSTSEC-2026-0153. Preserve its API
# while routing allocation/growth to the fixed upstream implementation.
[patch."https://github.com/microsoft/vscode-russh"]
russh-cryptovec = { path = "crates/idle-ssh-buffer-compat" }

[workspace.lints.rust]
warnings = { level = "deny", priority = -3 }
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -2 }
nonstandard_style = { level = "deny", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -2 }
rust_2024_compatibility = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -2 }
let_underscore = { level = "deny", priority = -2 }
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
meta_variable_misuse = "deny"
missing_debug_implementations = "deny"
missing_docs = "deny"
redundant_imports = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unstable_features = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -2 }
pedantic = { level = "deny", priority = -2 }

# Specific cargo lints (not the whole group — avoids metadata noise).
cargo_common_metadata = "deny"

# Specific nursery lints that add real value.
missing_assert_message = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
print_stderr = "deny"
print_stdout = "deny"
enum_glob_use = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
too_many_lines = "allow"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
missing_crate_level_docs = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"
