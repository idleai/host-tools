version: 2
registries:
  # Public indexes need no credentials; Dependabot requires a token field.
  idle-editchain:
    type: cargo-registry
    registry: idle-editchain
    url: https://raw.githubusercontent.com/idleai/editchain/cargo-index/
    token: anonymous
  idle-host-tools:
    type: cargo-registry
    registry: idle-host-tools
    url: https://raw.githubusercontent.com/idleai/host-tools/cargo-index/
    token: anonymous
updates:
  - package-ecosystem: cargo
    registries: "*"
    directory: /
    schedule:
      interval: daily
    groups:
      idle-packages:
        patterns: ["editchain*", "idle-*", "history-geometry", "app-core", "web-ui"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
