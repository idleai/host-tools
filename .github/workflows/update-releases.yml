name: Update released artifacts
on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-released-artifacts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Resolve complete compatible releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-releases.py
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          branch: deps/released-artifacts
          title: 'build(deps): update released artifacts'
          commit-message: 'build(deps): update released artifacts'
          body: 'Update compatible Cargo packages, producer releases and their SHA-256 checksums. The standard CI checks validate the resulting assembly.'
          add-paths: |
            Cargo.lock
            native-dependencies.json
            consumer-dependencies.json
      - name: Run CI for the generated dependency PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref deps/released-artifacts
