name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        description: Commit to validate before publication
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host-tools
    steps:
      - uses: actions/checkout@v7
        with:
          path: host-tools
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "host-tools -> target"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: host-tools/packages/history-runtime/package-lock.json
      - run: npm --prefix packages/history-runtime ci
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - run: bash scripts/check.sh
