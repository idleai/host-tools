name: Native release
on:
  push:
    tags: ["idle-coordination-v*"]
  workflow_call:
    inputs:
      publish:
        description: Attach the built bundles to the release
        type: boolean
        required: false
        default: true
      all_platforms:
        description: Add the other platforms only during a manual run
        type: boolean
        required: false
        default: false
      tag:
        type: string
        required: true
      dependencies_artifact:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the built bundles; disable to validate without changing the release
        type: boolean
        default: true
      all_platforms:
        description: Build all platforms and attach missing assets to the existing release
        type: boolean
        default: true
      tag:
        description: Existing release tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ${{ vars.IDLE_BACKGROUND_RUNNER || 'idle-background-linux-x64' }}
    permissions:
      contents: write
    outputs:
      artifact_id: ${{ inputs.dependencies_artifact || steps.record.outputs.artifact-id }}
    steps:
      - name: Download recorded dependencies from the draft release
        if: ${{ !inputs.dependencies_artifact }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release download "$RELEASE_TAG" --pattern released-dependencies.json --dir release-inputs --clobber
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.dependencies_artifact && github.event_name == 'workflow_dispatch' && inputs.all_platforms }}
        with:
          ref: ${{ inputs.tag }}
          path: release-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.dependencies_artifact && github.event_name == 'workflow_dispatch' && inputs.all_platforms }}
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Add platform checksums for the recorded dependency versions
        if: ${{ !inputs.dependencies_artifact && github.event_name == 'workflow_dispatch' && inputs.all_platforms }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDLE_RELEASE_INPUTS: ${{ github.workspace }}/release-inputs/released-dependencies.json
        run: python3 release-tools/scripts/release_dependencies.py --root release-source expand-platforms
      - uses: actions/upload-artifact@v7
        id: record
        if: ${{ !inputs.dependencies_artifact }}
        with:
          name: release-build-inputs
          path: release-inputs/released-dependencies.json
          if-no-files-found: error

  build:
    needs: dependencies
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.all_platforms && '["linux-x64","darwin-x64","darwin-arm64","win32-x64"]' || '["linux-x64"]') }}
    runs-on: ${{ matrix.platform == 'linux-x64' && (vars.IDLE_BACKGROUND_RUNNER || 'idle-background-linux-x64') || matrix.platform == 'darwin-x64' && 'macos-15-intel' || matrix.platform == 'darwin-arm64' && 'macos-15' || 'windows-2022' }}
    container: ${{ matrix.platform == 'linux-x64' && 'ubuntu:22.04' || '' }}
    defaults:
      run:
        shell: bash
    env:
      OPENSSL_STATIC: '1'
      IDLE_RELEASE_INPUTS: ${{ github.workspace }}/../release-inputs/released-dependencies.json
    steps:
      - name: Prepare Ubuntu 22.04 for Linux release builds
        if: runner.os == 'Linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libbz2-1.0 libffi8 libgdbm6 \
            liblzma5 libncursesw6 libreadline8 libsqlite3-0 libssl-dev pkg-config \
            sudo tk8.6 uuid-dev xz-utils zstd
          # Do not reuse the host's Ubuntu 24.04 Python or sccache binary.
          echo "AGENT_TOOLSDIRECTORY=/opt/idle-ubuntu2204-tools" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "IDLE_WORKSPACE_OWNER=$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Trust the mounted checkout inside the Linux container
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$(pwd -P)"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.dependencies.outputs.artifact_id }}
          path: ${{ github.workspace }}/../release-inputs
      - name: Restore the tested dependency selection
        run: python3 scripts/release_dependencies.py restore
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Configure static OpenSSL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
          echo "OPENSSL_LIB_DIR=/usr/lib/$(gcc -dumpmachine)" >> "$GITHUB_ENV"
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> "$GITHUB_ENV"
      - name: Configure static OpenSSL on macOS
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Cache Windows native dependencies
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-openssl-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: vcpkg-windows-openssl-
      - name: Configure static OpenSSL on Windows
        if: runner.os == 'Windows'
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/vcpkg-cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$VCPKG_INSTALLATION_ROOT/installed/x64-windows-static-md" >> "$GITHUB_ENV"
      - name: Build the native release bundle
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) }}
        run: |
          ARGS=()
          if [[ -n "$RELEASE_TAG" ]]; then ARGS+=(--tag "$RELEASE_TAG"); fi
          python3 scripts/package-native.py --output releases "${ARGS[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: releases/*
          if-no-files-found: error
      - name: Restore workspace ownership for the local runner
        if: always() && runner.os == 'Linux' && env.IDLE_WORKSPACE_OWNER != ''
        run: |
          chown -R "$IDLE_WORKSPACE_OWNER" "$GITHUB_WORKSPACE"
          if [[ -d "$(dirname "$IDLE_RELEASE_INPUTS")" ]]; then
            chown -R "$IDLE_WORKSPACE_OWNER" "$(dirname "$IDLE_RELEASE_INPUTS")"
          fi

  publish:
    if: (inputs.publish || github.event_name == 'push') && (inputs.tag != '' || github.ref_type == 'tag')
    needs: build
    runs-on: ${{ vars.IDLE_BACKGROUND_RUNNER || 'idle-background-linux-x64' }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: releases
      - name: Publish Linux or attach the manually built platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) }}
          ALL_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.all_platforms }}
        run: |
          ARGS=()
          if [[ "$ALL_PLATFORMS" == true ]]; then ARGS+=(--all-platforms); fi
          python3 release-tools/scripts/publish-native.py --repository "$GH_REPO" \
            --tag "$RELEASE_TAG" --directory releases "${ARGS[@]}"
