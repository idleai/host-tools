[workspace]
git_only = true
git_release_draft = true
release_always = true
publish_all_features = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
git_release_latest = false

[[package]]
name = "idle-coordination"
git_only = true
git_release_draft = true

[[package]]
name = "idle-host"
# This binary ships in the idle-coordination native bundle.
git_release_enable = false

[[package]]
name = "russh-cryptovec"
release = false
